<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Enquiry Form</title>
    <link rel="icon" href="../../src/assets/images/brand/icon.ico">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Intl-Tel-Input CSS for Country Flags -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 750px; /* Made the form bigger */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 0;
            overflow: hidden;
        }

        .form-header {
            text-align: center;
            padding: 35px 20px;
            border-bottom: 1px solid #eaeaea;
        }

        .form-header h2 {
            margin: 0;
            font-size: 26px;
            color: #333;
            font-weight: 500;
        }

        .form-body {
            padding: 40px 50px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }

        .required {
            color: #d93025;
        }

        .input-row {
            display: flex;
            gap: 20px;
        }

        .input-col {
            flex: 1;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.fa-user, 
        .input-wrapper i.fa-envelope, 
        .input-wrapper i.fa-message {
            position: absolute;
            left: 14px;
            color: #999;
            font-size: 15px;
            z-index: 2;
        }

        /* Align textarea icon to the top */
        .textarea-wrapper i.fa-message {
            top: 14px; 
        }

        .sub-label {
            display: block;
            margin-top: 6px;
            font-size: 13px;
            color: #777;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dcdcdc;
            border-radius: 5px;
            font-size: 15px;
            font-family: inherit;
            color: #333;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, color 0.3s ease;
        }

        .has-icon {
            padding-left: 40px !important;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1eb589;
        }

        /* Disabled Select Styling */
        select:disabled {
            background-color: #f5f5f5;
            color: #888;
            cursor: not-allowed;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23999%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        /* Intl Tel Input overrides */
        .iti {
            width: 100%;
        }

        /* Textarea specific styling */
        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .clear-btn {
            position: absolute;
            right: 10px;
            bottom: 15px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            color: #555;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }

        .clear-btn:hover {
            background-color: #e4e4e4;
            color: #d93025;
            border-color: #d93025;
        }

        /* Animation class applied via JS */
        .text-fade-out {
            color: transparent !important;
        }

        .submit-container {
            text-align: center;
            margin-top: 35px;
        }

        .submit-btn {
            background-color: #27b192;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #20967a;
        }

        /* Mobile Optimization */
        @media (max-width: 600px) {
            .form-body {
                padding: 25px 20px;
            }
            .input-row {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Consultation Enquiry Form</h2>
        </div>
        
        <div class="form-body">
            <form action="#" method="POST">
                
                <!-- Name Field -->
                <div class="form-group">
                    <label>Name <span class="required">*</span></label>
                    <div class="input-row">
                        <div class="input-col">
                            <div class="input-wrapper">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" class="has-icon" required>
                            </div>
                            <span class="sub-label">First Name</span>
                        </div>
                        <div class="input-col">
                            <input type="text" required>
                            <span class="sub-label">Last Name</span>
                        </div>
                    </div>
                </div>

                <!-- Mobile Number Field (All Countries) -->
                <div class="form-group">
                    <label>Mobile Number <span class="required">*</span></label>
                    <div>
                        <input type="tel" id="phone" required>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" class="has-icon" required>
                    </div>
                </div>

                <!-- Service Needed Field (Disabled) -->
                <div class="form-group">
                    <label>Service Needed <span class="required">*</span></label>
                    <select required disabled>
                        <option value="Consultation" selected>Consultation</option>
                        <option value="Other">Other Services</option>
                    </select>
                </div>

                <!-- Concern Field (Textarea with Clear Animation) -->
                <div class="form-group">
                    <label>Concern</label>
                    <div class="input-wrapper textarea-wrapper">
                        <i class="fa-regular fa-message"></i>
                        <textarea class="has-icon" id="concern-text"></textarea>
                        <button type="button" class="clear-btn" id="clear-btn">Clear</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="submit-container">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

            </form>
        </div>
    </div>

    <!-- Intl-Tel-Input JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    
    <script>
        // 1. Initialize Country Code Dropdown
        const phoneInputField = document.querySelector("#phone");
        const phoneInput = window.intlTelInput(phoneInputField, {
            initialCountry: "lk", // Defaults to Sri Lanka
            preferredCountries: ["lk", "in", "us", "gb"], 
            utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
        });

        // 2. Textarea Clear Animation Logic
        const concernTextarea = document.getElementById("concern-text");
        const clearBtn = document.getElementById("clear-btn");

        clearBtn.addEventListener("click", () => {
            if (concernTextarea.value.trim() !== "") {
                // Add class to trigger CSS color transition (fade out text)
                concernTextarea.classList.add("text-fade-out");
                
                // Wait for the transition to finish, then clear value and restore color
                setTimeout(() => {
                    concernTextarea.value = "";
                    concernTextarea.classList.remove("text-fade-out");
                    concernTextarea.focus(); // Return cursor to the cleared box
                }, 300); // 300ms matches the CSS transition duration
            }
        });
    </script>
</body>
</html>
